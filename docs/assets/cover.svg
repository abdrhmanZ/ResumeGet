<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title description">
  <title id="title">ResumeGet</title>
  <desc id="description">A C# command-line downloader. An illustration shows saved bytes followed by the remainder of a conditional HTTP range request.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111f35" />
      <stop offset="1" stop-color="#080f1c" />
    </linearGradient>
    <linearGradient id="range" x1="0" x2="1">
      <stop offset="0" stop-color="#64ddd0" />
      <stop offset="1" stop-color="#52aaf8" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9fbadd" stroke-opacity="0.045" />
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#background)" />
  <rect width="1280" height="400" rx="24" fill="url(#grid)" />
  <path d="M0 370H1280" stroke="#7dd3fc" stroke-opacity="0.13" />
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(56 52)">
      <rect width="36" height="36" rx="10" fill="#62dbd0" fill-opacity="0.12" />
      <path d="M13 10V26L26 18Z" fill="#79e4d8" />
      <path d="M9 10V26" stroke="#79e4d8" stroke-width="2" />
    </g>
    <text x="108" y="76" fill="#8fa8c7" font-size="13" font-weight="600" letter-spacing="2.5">A SMALL TOOL. A PRECISE CONTRACT.</text>
    <text x="52" y="177" fill="#f1f6ff" font-size="78" font-weight="700" letter-spacing="-3">ResumeGet</text>
    <text x="56" y="222" fill="#c0d0e6" font-size="25">Every byte has a place.</text>
    <text x="56" y="257" fill="#829bbd" font-size="17">Stream. Validate. Continue.</text>
    <g font-size="12" font-weight="600" text-anchor="middle">
      <rect x="56" y="299" width="85" height="30" rx="15" fill="#1b2d46" />
      <text x="98.5" y="319" fill="#c6d5e9">.NET 10</text>
      <rect x="151" y="299" width="51" height="30" rx="15" fill="#1b2d46" />
      <text x="176.5" y="319" fill="#c6d5e9">C#</text>
      <rect x="212" y="299" width="115" height="30" rx="15" fill="#1b2d46" />
      <text x="269.5" y="319" fill="#c6d5e9">HTTP RANGES</text>
      <rect x="337" y="299" width="54" height="30" rx="15" fill="#1b2d46" />
      <text x="364" y="319" fill="#c6d5e9">CLI</text>
    </g>
    <g transform="translate(731 65)">
      <rect width="493" height="270" rx="16" fill="#0d1829" stroke="#2a3c55" />
      <circle cx="24" cy="25" r="4" fill="#54708e" />
      <circle cx="40" cy="25" r="4" fill="#54708e" />
      <circle cx="56" cy="25" r="4" fill="#54708e" />
      <text x="465" y="29" text-anchor="end" fill="#7993b3" font-size="11" letter-spacing="1.5">RESUME MODEL</text>
      <path d="M0 48H493" stroke="#22354e" />
      <g font-family="Consolas, monospace" font-size="18">
        <text x="26" y="88" fill="#7de2d5">Range: <tspan fill="#d8e6f7">bytes=N-</tspan></text>
        <text x="26" y="121" fill="#7de2d5">If-Range: <tspan fill="#d8e6f7">&quot;version&quot;</tspan></text>
      </g>
      <text x="26" y="166" fill="#88a1bf" font-size="12">SAVED PREFIX</text>
      <text x="202" y="166" fill="#88a1bf" font-size="12">REMAINING BYTES</text>
      <rect x="26" y="182" width="144" height="25" rx="5" fill="#34516e" />
      <rect x="185" y="182" width="282" height="25" rx="5" fill="url(#range)" />
      <path d="M177 175V217" stroke="#f7bd70" stroke-width="2" stroke-dasharray="3 3" />
      <text x="177" y="239" text-anchor="middle" fill="#f7bd70" font-size="12" font-family="Consolas, monospace">offset N</text>
    </g>
  </g>
</svg>
